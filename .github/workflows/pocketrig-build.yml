# Builds PocketRig for modern Android phones (Android 10+, 64-bit) on every push
# and publishes the APK on the repo's Releases page, ready to install from a phone.
name: PocketRig APK

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: pocketrig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same signing key every build, so new APKs install over the old one.
      - name: Use PocketRig's signing key
        run: |
          mkdir -p ~/.android
          cp ci/pocketrig-debug.keystore ~/.android/debug.keystore

      # No analytics keys: PocketRig doesn't send usage data to GameNative's PostHog.
      - name: Write build settings
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=
          CLOUD_PROJECT_NUMBER=
          EOF

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:bundleModernRelease 2>&1 | tee build.log

      # Shows the reason for a failed build as notes on the run summary page.
      - name: Explain build failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          {
            grep -n -E "^e: |error:|FAILURE:|What went wrong|> Task .* FAILED|Execution failed|Caused by|Could not|not found|Exception" build.log | head -60
            echo "----- last lines -----"
            tail -n 60 build.log
          } > reason.txt
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            msg=$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)
            echo "::warning title=build log $i::$msg"
          done < reason.txt

      - name: Make installable APK
        run: |
          ./gradlew --stop
          java -Xmx3g -jar tools/bundletool-all-1.17.2.jar build-apks \
            --bundle=app/build/outputs/bundle/modernRelease/app-modern-release.aab \
            --output=pocketrig.apks --mode=universal \
            --ks=ci/pocketrig-debug.keystore --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -p pocketrig.apks universal.apk > PocketRig-${{ github.run_number }}.apk
          ls -la PocketRig-*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketrig-build-${{ github.run_number }}
          name: PocketRig build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Download the .apk below on your phone and tap it to install.
            For Android 10+ phones (64-bit). Built from ${{ github.sha }}.
          files: PocketRig-${{ github.run_number }}.apk
